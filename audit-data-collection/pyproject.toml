[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-data-collection"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "boto3>=1.34,<2",
  "botocore>=1.34,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[s3,iam,ec2,sts,ce]>=5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["audit_data_collection*"]
