[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-agents"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "boto3>=1.34,<2",
  "httpx>=0.27,<0.29",
  "langgraph>=0.2,<0.3",
  "langchain-core>=0.2,<0.4",
  "pyyaml>=6,<7",
  "redis>=5,<6",
  "rq>=1.16,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[sts,iam]>=5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["audit_agents*"]
