services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: audit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  audit-llm:
    build:
      context: .
      dockerfile: Dockerfile.llm
    ports:
      - "8001:8001"

  audit-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://audit:audit@postgres:5432/audit
      REDIS_URL: redis://redis:6379/0
      AUDIT_API_KEY: ${AUDIT_API_KEY:-dev-change-me}
      CORS_ORIGINS: http://localhost:3000
      # Same credential chain as audit-worker: required for POST /accounts/{id}/verify (STS AssumeRole)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      - postgres
      - redis

  audit-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+psycopg://audit:audit@postgres:5432/audit
      REDIS_URL: redis://redis:6379/0
      RULE_PACK_PATH: /app/rule_packs/v1
      ARTIFACTS_DIR: /data/artifacts
      AUDIT_LLM_URL: http://audit-llm:8001
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      - postgres
      - redis
      - audit-llm

  audit-frontend:
    build:
      context: ./audit-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      AUDIT_API_URL: http://audit-api:8000
      AUDIT_API_KEY: ${AUDIT_API_KEY:-dev-change-me}
    depends_on:
      - audit-api

volumes:
  pgdata:
  artifacts:
